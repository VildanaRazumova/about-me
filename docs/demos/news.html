    $("legend").innerHTML = [["user", u.legend[0]], ["flow", u.legend[1]], ["ai", u.legend[2]], ["data", u.legend[3]]].map(([r, l]) => `<li><i style="--r:var(--r-${r});--rb:var(--r-${r}-bg)"></i>${esc(l)}</li>`).join("") + `<li><i class="dash"></i>${esc(u.legend[4])}</li>`;
    const cv = $("canvas");
    cv.innerHTML = `<svg class="wires" aria-hidden="true"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 1.5L9 5L2 8.5" style="stroke-dasharray:none;stroke-width:1.5"/></marker></defs></svg><div class="flow" data-n="${f.n}" role="list">${itemsHTML(f.items)}</div>`;
    cv.dataset.wires = f.wires || ""; cv.style.paddingBottom = f.pad || "";
    if (!cv.__ro) { cv.__ro = new ResizeObserver(() => drawWires(cv)); cv.__ro.observe(cv); }
    document.fonts.ready.then(() => drawWires(cv)); drawWires(cv);
  }


  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
  const bold = (s) => esc(s).replace(/&lt;b&gt;/g, "<b>").replace(/&lt;\/b&gt;/g, "</b>");   // only <b> is allowed through
  let lang = "en";
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const loc = () => (lang === "en" ? "en-GB" : lang === "de" ? "de-DE" : "ru-RU");
  const dm = (off) => { const d = new Date(today); d.setDate(d.getDate() + off); return d.toLocaleDateString(loc(), { day: "2-digit", month: "2-digit" }); };
  const dates = (s) => String(s).replace(/\{d([+-]\d+)?\}/g, (m, o) => dm(o ? parseInt(o, 10) : 0));
  const kv = (r) => `<div class="kv"><span>${esc(dates(r[0]))}</span><b class="${r[2] || ""}">${esc(dates(r[1]))}</b></div>`;
  const card = (c) => c ? `<div class="card"><h4>${esc(dates(c.h))}</h4>${c.r.map(kv).join("")}${c.b ? `<div class="cb">${c.b.map((x) => `<span>${esc(x)}</span>`).join("")}</div>` : ""}</div>` : "";
  function frame(u, mode, active) {
    const rail = u.rail.map((l, i) => `<div class="${(mode === "chat" ? i === 1 : i === 2) ? "on" : ""}">${RAIL[i]}${esc(l)}</div>`).join("");
    let list;
    if (mode === "chat") {
      const it = (i, av, cls, href) => { const c = u.chats[i]; const tag = href && active !== i ? `a href="${href}"` : "div"; return `<${tag} class="li ${active === i ? "on" : ""}"><div class="av ${cls}">${av}</div><div><b>${esc(c[0])}</b><small>${esc(dates(c[1]))}</small></div></${href && active !== i ? "a" : "div"}>`; };
      list = `<h3>${esc(u.chat)} <span>⋯ &nbsp;✎</span></h3><div class="grp">${esc(u.pinned)}</div>${it(0, "$", "", "payments.html")}${it(1, "AI", "violet", "sales-digest.html")}<div class="grp">${esc(u.recent)}</div>${it(2, "M", "red")}${it(3, "S", "orange")}${it(4, "⚙", "grey", "alerts.html")}`;
    } else {
      const hrefs = [null, "sales-digest.html", "alerts.html"];
      list = `<h3>${esc(u.teams)} <span>⋯</span></h3><div class="li"><div class="av teal">D</div><div><b>${esc(u.team)}</b></div></div>` + u.channels.map((c, i) => { const h = hrefs[i] && active !== i; return `<${h ? `a href="${hrefs[i]}"` : "div"} class="li ${active === i ? "on" : ""}" style="padding-left:18px"><span class="ch">#</span><div><b>${esc(c)}</b></div></${h ? "a" : "div"}>`; }).join("");
    }
    return `<div class="tbar"><div class="search">🔍&nbsp; ${esc(u.search)}</div></div>
      <div class="fbody"><div class="rail">${rail}</div><div class="list">${list}</div>
      <div class="pane"><div class="hdr" id="hdr"></div><div class="filterbar" id="fbar" hidden></div><div class="msgs" id="msgs"></div><div class="compose" id="compose"></div></div></div>`;
  }
  function common(u, t) {
    document.documentElement.lang = lang; const h = HOW[lang];
    $("t-role").textContent = u.role; $("t-crumb").textContent = t.crumb; $("t-back").textContent = u.back.replace(/^←\s*/, " "); $("t-howbtn").textContent = h.lvl2; $("t-how").textContent = h.lvl2; $("t-lvl1").textContent = h.lvl1;
    $("t-title").textContent = t.title; $("t-lead").textContent = t.lead; $("t-pill").textContent = t.pill;
    document.title = t.title + " — Vildana Razumova";
    document.querySelectorAll("#lang button").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.lang === lang)));
    try { localStorage.setItem("lang", lang); } catch (e) {}
    renderHow(FLOW[lang], h);
  }
  function scrollToLast(sel) { const m = $("msgs"), all = m.querySelectorAll(sel), el = all[all.length - 1]; m.scrollTop = el ? Math.max(0, el.offsetTop - 12) : 0; }
  function boot(setLang) {
    let initial = null; try { initial = localStorage.getItem("lang"); } catch (e) {}
    if (!initial) { const nav = (navigator.language || "en").slice(0, 2).toLowerCase(); initial = T[nav] ? nav : "en"; }
    setLang(initial);
    document.querySelectorAll("#lang button").forEach((x) => x.addEventListener("click", () => setLang(x.dataset.lang)));
  }

  function setLang(l) { if (!T[l]) l = "en"; lang = l; const u = UI[l], t = T[l]; $("demo").innerHTML = `<h3>${esc(t.soon[0])}</h3><p>${esc(t.soon[1])}</p>`; common(u, t); }
  boot(setLang);

</script>
</body>
