 wird die Datenqualität geprüft?", "Nutzt das Business diese Daten?"], "ru": ["Расскажи про этот проект", "Какие технологии использовались?", "Что Вильдана делала в этом проекте?", "Какой результат на сегодня?", "Зачем собирать новости, если они не дали сигнала?", "Что модель делает с новостями?", "Как проверяется качество данных?", "Бизнес уже пользуется этими данными?"]}};
