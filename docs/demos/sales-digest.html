  :root {

  * { box-sizing: border-box; }

  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; color: var(--ink); text-decoration: none; }

  .btn:hover { border-color: var(--faint); }

  /* ── section ── */
  .how { margin-top: 72px; scroll-margin-top: 80px; }

  .how h2 { font: 600 26px/1.15 var(--sans); letter-spacing: -.015em; margin: 10px 0 0; text-wrap: balance; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0; padding: 0; list-style: none; font: 12.5px/1 var(--sans); color: var(--muted); }
  .legend li { display: flex; align-items: center; gap: 6px; }

  .legend .dash { width: 18px; height: 0; border-radius: 0; background: none; box-shadow: none; border-top: 1.5px dashed var(--edge); }
  /* ── canvas ── */
  .canvas { position: relative; border: 1px solid var(--line); border-radius: 18px; padding: 44px 24px 40px;
    background: radial-gradient(circle, var(--dot) 1px, transparent 1.5px) 0 0 / 16px 16px, var(--canvas); }
  .wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
  .wires path { fill: none; stroke: var(--edge); stroke-width: 1.5; }
  .wires .dash { stroke-dasharray: 4 4; }
  .wires text { font: 500 11px var(--sans); fill: var(--muted); paint-order: stroke; stroke: var(--canvas); stroke-width: 5px; stroke-linejoin: round; }
  .flow { --gap: 44px; position: relative; z-index: 1; display: grid; align-items: center; row-gap: 56px; grid-template-columns: repeat(4, minmax(0,1fr) var(--gap)) minmax(0,1fr); }
  .flow[data-n="4"] { grid-template-columns: repeat(3, minmax(0,1fr) var(--gap)) minmax(0,1fr); }
  .flow[data-n="6"] { --gap: 32px; grid-template-columns: repeat(5, minmax(0,1fr) var(--gap)) minmax(0,1fr); }
  .node { --r: var(--r-flow); --rb: var(--r-flow-bg); position: relative; min-width: 0; min-height: 124px; display: flex; flex-direction: column; gap: 4px; padding: 12px 14px;
    background: var(--node); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .node[data-role="user"] { --r: var(--r-user); --rb: var(--r-user-bg); }
  .node[data-role="ai"] { --r: var(--r-ai); --rb: var(--r-ai-bg); }
  .node[data-role="data"] { --r: var(--r-data); --rb: var(--r-data-bg); }
  .n-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .n-ico { width: 28px; height: 28px; flex: none; border-radius: 8px; display: grid; place-items: center; background: var(--rb); color: var(--r); }
  .n-ico svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .n-demo { font: 500 11.5px/1 var(--sans); color: var(--brand-ink); text-decoration: none; white-space: nowrap; }
  .n-demo:hover { text-decoration: underline; }
  .n-br { font: 600 10.5px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
  .n-title { font: 600 14px/1.3 var(--sans); letter-spacing: -.005em; }
  .n-sub { font-size: 12.5px; line-height: 1.4; color: var(--muted); }
  .n-tech { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; padding-top: 6px; }
  .n-tech span { font: 500 11px/20px var(--sans); padding: 0 7px; border-radius: 6px; background: var(--chip); color: var(--muted); white-space: nowrap; }
  .node.stack { box-shadow: 4px 4px 0 -1px var(--node), 4px 4px 0 0 var(--line), 8px 8px 0 -1px var(--node), 8px 8px 0 0 var(--line); }
  .ports { list-style: none; margin: 2px -14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .ports li { position: relative; padding-right: 14px; text-align: right; font: 500 11.5px/20px var(--sans); color: var(--muted); white-space: nowrap; }
  .ports li::after { content: ""; position: absolute; right: -5px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; background: var(--node); box-shadow: 0 0 0 1.5px var(--r); }
  .ports li.ok { color: var(--ok); } .ports li.ok::after { background: var(--ok); box-shadow: none; }
  .ports li.warn { color: var(--warn); } .ports li.warn::after { background: var(--warn); box-shadow: none; }
  .ports li.err { color: var(--err); } .ports li.err::after { background: var(--err); box-shadow: none; }
  .edge { position: relative; align-self: stretch; }
  .edge::before { content: ""; position: absolute; left: 3px; right: 5px; top: 50%; height: 1.5px; margin-top: -.75px; background: var(--edge); }
  .edge::after { content: ""; position: absolute; right: 5px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border: solid var(--edge); border-width: 1.5px 1.5px 0 0; transform: rotate(45deg); }
  .edge.dash::before { background: repeating-linear-gradient(90deg, var(--edge) 0 4px, transparent 4px 8px); }
  .edge.js::before, .edge.js::after { display: none; }
  .e-lbl { position: absolute; left: 50%; bottom: calc(50% + 6px); transform: translateX(-50%); font: 500 11px/1 var(--sans); color: var(--muted); white-space: nowrap; }
  /* lanes: separate flows that meet in one node; every node the same size */
  .flow.lanes { row-gap: 64px; }
  .flow.lanes .node { min-height: 0; height: 150px; overflow: hidden; }
  .flow.lanes .n-sub { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .group { display: grid; grid-template-columns: subgrid; align-items: center; position: relative; margin: -34px -12px -12px; padding: 34px 12px 12px; border: 1px dashed var(--edge); border-radius: 20px; }
  .g-lbl { position: absolute; top: 11px; left: 14px; display: flex; align-items: center; gap: 6px; font: 500 12px/1 var(--sans); color: var(--muted); }
  .g-lbl svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  @media (max-width: 760px) {
    .how { margin-top: 48px; } .how h2 { font-size: 21px; }
    .canvas { padding: 16px 12px; background: var(--canvas); }
    .wires { display: none; }
    .flow, .flow[data-n] { display: flex; flex-direction: column; align-items: stretch; gap: 0; }
    .group { display: flex; flex-direction: column; align-items: stretch; margin: 0; padding: 36px 10px 10px; }
    .node { min-height: 0; }
    .ports { margin: 4px 0 0; } .ports li { text-align: left; padding: 0 0 0 16px; } .ports li::after { right: auto; left: 0; }
    .edge { height: 28px; flex: none; }
    .edge::before { left: 28px; right: auto; top: 3px; bottom: 5px; width: 1.5px; height: auto; margin: 0; }
    .edge::after { left: 25px; right: auto; top: auto; bottom: 5px; margin: 0; transform: rotate(135deg); }
    .edge.dash::before { background: repeating-linear-gradient(180deg, var(--edge) 0 4px, transparent 4px 8px); }
    .edge.js::before, .edge.js::after { display: block; }
    .e-lbl { left: 44px; bottom: auto; top: 50%; transform: translateY(-50%); }
    .flow > .node.br { margin-top: 28px; border-style: dashed; }
    .flow.lanes .node { height: auto; } .flow.lanes .group + .group { margin-top: 12px; }
  }
