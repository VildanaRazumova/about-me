<style>
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/inter-latin-400-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }

  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/inter-latin-500-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/inter-cyrillic-500-normal.woff2) format('woff2'); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/inter-latin-600-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/inter-cyrillic-600-normal.woff2) format('woff2'); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  @font-face { font-family: 'Source Serif 4'; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/source-serif-4-latin-500-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: 'Source Serif 4'; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/source-serif-4-cyrillic-500-normal.woff2) format('woff2'); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  @font-face { font-family: 'Source Serif 4'; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/source-serif-4-latin-600-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: 'Source Serif 4'; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/source-serif-4-cyrillic-600-normal.woff2) format('woff2'); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  /* Same palette as the start page: warm paper, her green and gold */
  :root {
    --bg: #f6f4ee; --surface: #ffffff; --ink: #1a1f1c; --muted: #56615b; --faint: #68716c;
    --line: #e4e0d6; --line-strong: #8a928d;
    --brand: #2e7a63; --brand-ink: #1f5e4c; --brand-soft: #e4efe9; --on-brand: #ffffff;
    --gold: #d4a92b;
    --shadow: 0 1px 2px rgba(26, 31, 28, .04), 0 10px 30px rgba(26, 31, 28, .07);
    --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Source Serif 4", Georgia, serif;
    --page: 920px; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1210; --surface: #151b18; --ink: #edf1ed; --muted: #a9b4ae; --faint: #8f9a94;
      --line: #253029; --line-strong: #5f6b64;
      --brand: #5cc29c; --brand-ink: #86d6b8; --brand-soft: #16302a; --on-brand: #0b1411;
      --gold: #e3bd52;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15.5px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--brand-ink); }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }

  .top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px max(20px, calc((100% - var(--page)) / 2)); background: color-mix(in srgb, var(--bg) 93%, transparent);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; color: var(--ink); text-decoration: none; }
  .brand img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 1px var(--line); }
  .who { display: flex; flex-direction: column; line-height: 1.15; font-weight: 600; letter-spacing: -.01em; }
  .who small { font-weight: 500; font-size: 12.5px; letter-spacing: 0; color: var(--muted); }
  .actions { display: flex; gap: 6px; align-items: center; }
  .lang { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: color-mix(in srgb, var(--surface) 70%, transparent); }
  .lang button { height: 30px; min-width: 36px; padding: 0 8px; border: 0; border-radius: 999px; background: none; font: 600 12px var(--sans); letter-spacing: .06em; color: var(--muted); cursor: pointer; }
  .lang button:hover { color: var(--ink); }
  .lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--ink);
    background: var(--ink); color: var(--bg); text-decoration: none; font: 500 14px var(--sans); white-space: nowrap; }
  .btn:hover { background: color-mix(in srgb, var(--ink) 86%, var(--brand)); }
  .btn .spark { width: 14px; height: 14px; fill: var(--gold); }

  main { max-width: calc(var(--page) + 40px); margin: 0 auto; padding: 56px 20px 96px; }
  h1 { font: 600 clamp(40px, 6vw, 64px)/1.02 var(--serif); letter-spacing: -.03em; margin: 0 0 14px; }
  .lead { color: var(--muted); font-size: 17.5px; line-height: 1.55; max-width: 58ch; margin: 0; text-wrap: pretty; }

  /* A section is an overline, not a heading block */
  .section { margin-top: 56px; }
  .section-h { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .section-h h2 { margin: 0; font: 600 11.5px/1.4 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink); }
  .section-h p { margin: 0; font-size: 14px; color: var(--muted); }
  .section-h p[hidden] { display: none; }

  /* Projects: one calm row each — number, name, one paragraph, stack; status and arrow on the right */
  .list { list-style: none; margin: 0; padding: 0; }
  .row { position: relative; display: grid; grid-template-columns: 52px minmax(0, 1fr) auto 44px; column-gap: 20px; align-items: start;
    padding: 26px 0; border-bottom: 1px solid var(--line); }
  .num { font: 500 15px/1 var(--serif); color: var(--faint); padding-top: 9px; font-variant-numeric: tabular-nums; }
  .row h3 { margin: 0; font: 600 clamp(22px, 2.6vw, 27px)/1.2 var(--serif); letter-spacing: -.015em; }
  .row h3 a { color: var(--ink); text-decoration: none; transition: color .2s; }
  .row h3 a::after { content: ""; position: absolute; inset: 0; }   /* the whole row opens the demo */
  .row:hover h3 a { color: var(--brand-ink); }
  .row .d { margin: 8px 0 0; color: var(--muted); max-width: 60ch; text-wrap: pretty; }
  .row .stack { margin: 12px 0 0; font-size: 12.5px; letter-spacing: .01em; color: var(--faint); }
  .st { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; padding: 5px 11px 5px 9px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--surface); font: 500 12.5px/1.2 var(--sans); color: var(--muted); white-space: nowrap; }
  .st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
  .st.ended::before { background: var(--faint); box-shadow: none; }
  .st.pilot::before { background: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 22%, transparent); }
  .go { width: 44px; height: 44px; margin-top: 2px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink); background: var(--surface); transition: background .2s, color .2s, border-color .2s, transform .2s; }
  .go svg { width: 18px; height: 18px; }
  .row:hover .go { background: var(--brand); border-color: var(--brand); color: var(--on-brand); transform: rotate(-45deg); }
  .row:has(a:focus-visible) { outline: 2px solid var(--brand); outline-offset: -2px; border-radius: 14px; }
  .row a:focus-visible { outline: none; }
  .row.soon .go { display: none; }
  .row.soon .soon-note { margin: 10px 0 0; font-size: 14px; color: var(--faint); }

  @media (prefers-reduced-motion: reduce) { .row h3 a, .go { transition: none; } .row:hover .go { transform: none; } }
  @media (max-width: 720px) {
    .top { padding: 10px 14px; }
    .who { display: none; }
    .lang button { min-width: 32px; padding: 0 6px; }
    .btn { padding: 0 14px; }
    main { padding: 32px 16px 64px; }
    .lead { font-size: 16px; }
    .section { margin-top: 44px; }
    .row { grid-template-columns: minmax(0, 1fr) 40px; column-gap: 14px; padding: 22px 0; }
    .num { display: none; }
    .row .side { grid-column: 1; grid-row: 1; }
    .row .main { grid-column: 1; grid-row: 2; }
    .go { grid-column: 2; grid-row: 1; width: 40px; height: 40px; margin-top: 0; }
    .st { margin: 0 0 12px; }
    .row h3 { font-size: 22px; }
    .row .d { font-size: 15px; }
  }
</style>
</head>
<body>
  <header class="top">
    <a class="brand" href="./"><img src="photo.jpg" alt="" width="32" height="32"><span class="who"><span class="nm">Vildana Razumova</span><small id="t-role">AI/ML Project Lead</small></span></a>
    <nav class="actions">
      <div class="lang" id="lang" role="group" aria-label="Language"><button type="button" data-lang="en" lang="en">EN</button><button type="button" data-lang="de" lang="de">DE</button><button type="button" data-lang="ru" lang="ru">RU</button></div>
      <a class="btn" href="./"><svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"/></svg><span id="t-back">Ask the assistant</span></a>
    </nav>
  </header>
  <main>
    <h1 id="t-title">Portfolio</h1>
    <p class="lead" id="t-lead"></p>
    <section class="section" aria-labelledby="s1-h"><div class="section-h"><h2 id="s1-h"></h2><p id="s1-l" hidden></p></div><ol class="list" id="g1"></ol></section>
    <section class="section" aria-labelledby="s2-h"><div class="section-h"><h2 id="s2-h"></h2><p id="s2-l" hidden></p></div><ol class="list" id="g2" start="3"></ol></section>
  </main>
<script>
  const T = {"en": {"role": "AI/ML Project Lead", "back": "Ask the assistant", "title": "Portfolio", "lead": "Real projects, shown here on synthetic data. Open one to see how it works.", "open": "Open the demo", "soon": "Demo in preparation", "s1": ["Pricing and demand", ""], "c1": [["Testing", "Price revisions with comments", "Recommends a price change for every flight and length of stay, built from an ML load forecast and rule-based signals. Managers accept or reject each one.", "Python · LightGBM · ClickHouse · Airflow · n8n", "demos/revisions.html"], ["In production", "External market signals", "Gathers AI-scored destination news, oil prices, exchange rates, weather and search interest every day, and sends one Teams summary each morning.", "n8n · Azure AI Foundry · ClickHouse · Microsoft Teams", "demos/news.html"]], "s2": ["Assistants in Microsoft Teams", "Built for the company's staff; here — copies on demo data."], "c2": [["In production", "Payments assistant", "Managers ask about a payment in plain language; the assistant finds the booking, shows its payments and, if needed, files a request with accounting.", "Dify · Azure AI Foundry · ClickHouse · Jira", "demos/payments.html"], ["May – September 2026", "AI sales analyst", "At 08:00 every morning, each destination's Teams channel got a sales summary. Database queries computed the figures; the model only wrote the text. In September 2026 direct access to the database through Claude replaced it.", "n8n · FastAPI · Azure AI Foundry · ClickHouse", "demos/sales-digest.html"], ["In production", "System alerts", "Every system posts a run report with checks and data gaps to a shared Teams channel, so failures surface before they distort the figures.", "Airflow · n8n · Microsoft Teams", "demos/alerts.html"]]}, "de": {"role": "AI/ML Project Lead", "back": "Assistenten fragen", "title": "Portfolio", "lead": "Reale Projekte, hier mit synthetischen Daten gezeigt. Öffnen Sie ein Projekt, um zu sehen, wie es funktioniert.", "open": "Demo öffnen", "soon": "Demo in Vorbereitung", "s1": ["Preise und Nachfrage", ""], "c1": [["Testphase", "Preisrevisionen mit Kommentaren", "Empfiehlt für jeden Flug und jede Reisedauer eine Preisänderung aus einer ML-Prognose der Auslastung und regelbasierten Signalen. Manager nehmen jede Empfehlung an oder lehnen sie ab.", "Python · LightGBM · ClickHouse · Airflow · n8n", "demos/revisions.html"], ["Im Einsatz", "Externe Marktsignale", "Sammelt täglich KI-bewertete Nachrichten zu Reisezielen, Ölpreis, Wechselkurse, Wetter und Suchinteresse und schickt jeden Morgen eine Zusammenfassung in Teams.", "n8n · Azure AI Foundry · ClickHouse · Microsoft Teams", "demos/news.html"]], "s2": ["Assistenten in Microsoft Teams", "Für die Mitarbeitenden des Unternehmens gebaut; hier — Kopien auf Demo-Daten."], "c2": [["Im Einsatz", "Zahlungsassistent", "Manager fragen in Alltagssprache nach einer Zahlung; der Assistent findet die Buchung, zeigt die zugehörigen Zahlungen und stellt bei Bedarf eine Anfrage an die Buchhaltung.", "Dify · Azure AI Foundry · ClickHouse · Jira", "demos/payments.html"], ["Mai – September 2026", "KI-Verkaufsanalyst", "Jeden Morgen um 8:00 Uhr erhielt der Teams-Kanal jedes Reiseziels eine Verkaufsübersicht. Die Zahlen stammten aus Datenbankabfragen, das Modell schrieb nur den Text. Im September 2026 wurde sie durch direkten Datenbankzugriff über Claude ersetzt.", "n8n · FastAPI · Azure AI Foundry · ClickHouse", "demos/sales-digest.html"], ["Im Einsatz", "Systemmeldungen", "Jedes System meldet nach jedem Lauf Prüfergebnisse und Datenlücken in einem gemeinsamen Teams-Kanal. So fallen Störungen auf, bevor sie die Zahlen verfälschen.", "Airflow · n8n · Microsoft Teams", "demos/alerts.html"]]}, "ru": {"role": "AI/ML Project Lead", "back": "Спросить ассистента", "title": "Портфолио", "lead": "Реальные проекты на синтетических данных. Откройте любой и посмотрите, как он работает.", "open": "Открыть демо", "soon": "Демо готовится", "s1": ["Ценообразование и спрос", ""], "c1": [["Тестирование", "Ревизии цен с комментариями", "Предлагает изменение цены для каждого рейса и длительности тура на основе ML-прогноза загрузки и правил. Менеджер принимает или отклоняет каждую рекомендацию.", "Python · LightGBM · ClickHouse · Airflow · n8n", "demos/revisions.html"], ["В эксплуатации", "Внешние сигналы рынка", "Каждый день собирает новости по направлениям с оценкой ИИ, цены на нефть, курсы валют, погоду и поисковый интерес, а утром присылает в Teams одну сводку изменений.", "n8n · Azure AI Foundry · ClickHouse · Microsoft Teams", "demos/news.html"]], "s2": ["Помощники в Microsoft Teams", "Сделаны для сотрудников компании; здесь — копии на демо-данных."], "c2": [["В эксплуатации", "Помощник по платежам", "Менеджер спрашивает о платеже своими словами, а помощник находит заявку, показывает платежи по ней и при необходимости создаёт запрос в бухгалтерию.", "Dify · Azure AI Foundry · ClickHouse · Jira", "demos/payments.html"], ["Май – сентябрь 2026", "AI-аналитик по продажам", "Каждое утро в 08:00 каналы направлений в Teams получали сводку продаж. Цифры считала база данных, а модель только писала текст. В сентябре 2026 сводку заменил прямой доступ к базе через Claude.", "n8n · FastAPI · Azure AI Foundry · ClickHouse", "demos/sales-digest.html"], ["В эксплуатации", "Алерты систем", "После каждого запуска системы отчитываются в общем канале Teams: что сделано, какие проверки пройдены, где не хватает данных. Так сбой заметен раньше, чем попадёт в цифры.", "Airflow · n8n · Microsoft Teams", "demos/alerts.html"]]}};
  const NAME = { en: "Vildana Razumova", de: "Vildana Razumova", ru: "Вильдана Разумова" };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  function rows(list, d, from) {
    return list.map(([st, h, desc, stack, href, label], i) => {
      const n = String(from + i).padStart(2, "0"), pilot = from + i === 1, ended = /[–-]\s*(September|сентябрь)/i.test(st);
      const title = href ? `<a href="${href}" aria-label="${esc(label || d.open)}: ${esc(h)}">${esc(h)}</a>` : esc(h);
      return `<li class="row${href ? "" : " soon"}"><span class="num" aria-hidden="true">${n}</span>
        <div class="main"><h3>${title}</h3><p class="d">${esc(desc)}</p><p class="stack">${esc(stack)}</p>${href ? "" : `<p class="soon-note">${esc(d.soon)}</p>`}</div>
        <div class="side"><span class="st${pilot ? " pilot" : ""}${ended ? " ended" : ""}">${esc(st)}</span></div>
        <span class="go" aria-hidden="true">${ARROW}</span></li>`;
    }).join("");
  }
  function setLang(l) {
    if (!T[l]) l = "en"; const d = T[l]; document.documentElement.lang = l;
    $("t-role").textContent = d.role; $("t-back").textContent = d.back; $("t-title").textContent = d.title; $("t-lead").textContent = d.lead;
    document.title = d.title + " — " + NAME[l]; document.querySelectorAll(".nm").forEach((e) => { e.textContent = NAME[l]; });
    $("s1-h").textContent = d.s1[0]; $("s1-l").textContent = d.s1[1]; $("s1-l").hidden = !d.s1[1]; $("g1").innerHTML = rows(d.c1, d, 1);
    $("s2-h").textContent = d.s2[0]; $("s2-l").textContent = d.s2[1]; $("s2-l").hidden = !d.s2[1]; $("g2").innerHTML = rows(d.c2, d, 1 + d.c1.length);
    document.querySelectorAll("#lang button").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.lang === l)));
    try { localStorage.setItem("lang", l); } catch (e) {}
  }
  let initial = null; try { initial = localStorage.getItem("lang"); } catch (e) {}
  if (!initial) { const nav = (navigator.language || "en").slice(0, 2).toLowerCase(); initial = T[nav] ? nav : "en"; }
  setLang(initial);
  document.querySelectorAll("#lang button").forEach((x) => x.addEventListener("click", () => setLang(x.dataset.lang)));
</script>
</body>
