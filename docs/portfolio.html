  :root {
    --bg: #ffffff; --surface: #ffffff; --ink: #1d1d1f; --muted: #6e6e73; --faint: #86868b; --line: #d2d2d7;
    --brand: #0071e3; --brand-ink: #0066cc; --brand-soft: #eaf2fd; --accent: #0071e3;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    --radius: 14px;
    --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Source Serif 4", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --surface: #1d1d1f; --ink: #f5f5f7; --muted: #a1a1a6; --faint: #86868b;
      --line: #424245; --brand: #2997ff; --brand-ink: #6fb5ff; --brand-soft: #14304d; --accent: #2997ff;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15.5px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--brand-ink); }
  :root { --page: 1000px; }
  .top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px max(16px, calc((100% - var(--page)) / 2)); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; color: var(--ink); text-decoration: none; }
  .who { display: flex; flex-direction: column; line-height: 1.15; }
  .who small { font-weight: 500; font-size: 12.5px; color: var(--muted); }
  .actions { display: flex; gap: 8px; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font: 500 14px var(--sans); cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--faint); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn[aria-disabled="true"] { opacity: .5; cursor: default; }
  .lang { display: inline-flex; height: 36px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); overflow: hidden; }
  .lang button { border: 0; background: none; padding: 0 11px; font: 600 12.5px var(--sans); letter-spacing: .04em; color: var(--muted); cursor: pointer; }
  .lang button + button { border-left: 1px solid var(--line); }
  .lang button[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand-ink); }
  main { max-width: calc(var(--page) + 40px); margin: 0 auto; padding: 40px 20px 96px; }
  h1 { font: 600 clamp(28px, 4.4vw, 40px)/1.1 var(--serif); letter-spacing: -.02em; margin: 0 0 10px; text-wrap: balance; }
  .lead { color: var(--muted); font-size: 17px; max-width: 64ch; margin: 0 0 24px; }
  .pill { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border: 0; background: var(--chip, #f2f2f5); font: 500 12px/24px var(--sans); color: var(--muted); border-radius: 999px; white-space: nowrap; }
  .tag { font: 500 12px var(--sans); color: var(--brand-ink); background: var(--brand-soft); border-radius: 999px; padding: 4px 9px; white-space: nowrap; }
  .small { color: var(--faint); font-size: 12.5px; }
  @media (max-width: 640px) {
    .top { padding: 10px 16px; } .who small { display: none; } .brand { font-size: 14px; }
    .lang button { padding: 0 8px; } .btn { padding: 0 12px; } .hide-sm { display: none; }
    main { padding: 24px 16px 64px; }
  }

  .section { margin-top: 44px; }
  .section:first-of-type { margin-top: 8px; }
  .section h2 { font: 600 26px/1.15 var(--sans); letter-spacing: -.015em; margin: 0; }
  .section .lede { font-size: 16px; color: var(--muted); margin: 6px 0 0; max-width: 64ch; }
  .grid { display: grid; gap: 20px; margin-top: 18px; }
  .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .card { position: relative; display: flex; flex-direction: column; padding: 26px 26px 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; transition: border-color .2s, box-shadow .2s; }
  .card:hover { border-color: var(--faint); box-shadow: 0 8px 24px rgba(0, 0, 0, .06); }
  .card .st { font: 600 12.5px/1.3 var(--sans); color: var(--muted); margin: 0 0 8px; letter-spacing: .01em; }
  .card h3 { font: 600 21px/1.2 var(--sans); letter-spacing: -.015em; margin: 0; text-wrap: balance; }
  .card p.d { font-size: 15.5px; line-height: 1.47; color: var(--muted); margin: 10px 0 0; }
  .card .foot { margin-top: auto; padding-top: 22px; }
  .card .stack { font-size: 13.5px; line-height: 1.45; color: var(--faint); margin: 0; }
  .card a.open { display: inline-block; margin-top: 14px; font: 500 16px/1.2 var(--sans); color: var(--brand-ink); text-decoration: none; }
  .card a.open::before { content: ""; position: absolute; inset: 0; border-radius: inherit; }
  .card a.open::after { content: "\203A"; display: inline-block; margin-left: 5px; transition: transform .2s; }
  .card:hover a.open::after { transform: translateX(3px); }
  .card:has(a.open:focus-visible) { outline: 2px solid var(--brand); outline-offset: 3px; }
  .card a.open:focus-visible { outline: none; }
  .card.soon, .card.soon:hover { background: color-mix(in srgb, var(--line) 35%, var(--bg)); border-color: transparent; box-shadow: none; }
  .card .note { margin-top: 14px; font-size: 15px; color: var(--faint); }
  @media (max-width: 1000px) { .grid.three { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid.three > :nth-child(3) { grid-column: 1 / -1; } }
  @media (max-width: 720px) { .grid.two, .grid.three { grid-template-columns: 1fr; gap: 14px; } .grid.three > :nth-child(3) { grid-column: auto; } .card { padding: 22px 20px 20px; } .card h3 { font-size: 19px; } .section { margin-top: 36px; } }
